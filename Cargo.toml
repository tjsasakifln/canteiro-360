[workspace]
resolver = "3"
members = [
  "crates/domain", "crates/application", "crates/persistence", "crates/contracts",
  "crates/web", "crates/api", "crates/jobs", "tools/xtask", "tools/e2e",
]
default-members = ["crates/api", "crates/jobs", "tools/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "LicenseRef-Proprietary"
repository = "https://github.com/tjsasakifln/canteiro-360"

[workspace.dependencies]
leptos = { version = "=0.8.23", default-features = false }
leptos_meta = { version = "=0.8.7", default-features = false }
leptos_router = { version = "=0.8.17", default-features = false }
leptos_axum = "=0.8.10"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.9.8"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header", "compression-br"] }
tower = { version = "=0.5.3", features = ["util"] }
wasm-bindgen = "=0.2.130"
console_error_panic_hook = "=0.1.7"
regex = "=1.13.1"
brotli = "=9.1.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
base64 = "=0.22.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.canteiro]
wasm-bindgen-cli = "0.2.130"
cargo-deny = "0.20.2"
browser-version = "156.0.8078.80"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

