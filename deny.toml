# Conferência do grafo efetivamente usado no servidor e no navegador.
[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 é macro transitiva de Leptos 0.8.23; aviso de manutenção encerrada, sem vulnerabilidade técnica atribuída nem versão corrigida. Versão fixada no Cargo.lock; revisar a exceção na próxima atualização do framework. Novos avisos não estão dispensados." },
]

[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# O código próprio não é publicado no registro de pacotes. Esta opção não
# dispensa a inspeção das licenças de qualquer dependência externa.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
